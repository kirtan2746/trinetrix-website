
<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Website title -->
    <title>
      Vilartech | Creative & Digital Solutions Australia
    </title>

    <!-- SEO description -->
    <meta
      name="description"
      content="Vilartech is an Adelaide-based creative and digital solutions studio powered by Trinetrix. Explore branding, web design, digital marketing, business technology, data intelligence and automation."
    />

    <!-- SEO keywords -->
    <meta
      name="keywords"
      content="Vilartech, Trinetrix, web design Adelaide, branding Australia, digital solutions, digital marketing, business automation, Power BI, Microsoft 365, creative studio"
    />

    <meta name="author" content="Vilartech" />

    <!-- Theme colour -->
    <meta name="theme-color" content="#F5FAF7" />

    <!-- Search engine indexing -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://vilartech.com.au/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/vilartech-logo.svg"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Vilartech"
    />

    <meta
      property="og:title"
      content="Vilartech | Creative & Digital Solutions"
    />

    <meta
      property="og:description"
      content="Thoughtful design meets smart technology. Discover creative and digital solutions from Vilartech, powered by Trinetrix."
    />

    <meta
      property="og:url"
      content="https://vilartech.com.au/"
    />

    <meta
      property="og:locale"
      content="en_AU"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Vilartech | Creative & Digital Solutions"
    />

    <meta
      name="twitter:description"
      content="Creative thinking, thoughtful design and smart technology. Powered by Trinetrix."
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
